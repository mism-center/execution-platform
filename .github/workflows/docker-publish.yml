# Build and push Docker image to Docker Hub on pushes to test branches.
# Tags the image with the short commit SHA.
name: Docker Build & Push

on:
  push:
    branches-ignore:
      - "main"

permissions:
  contents: read

jobs:
  docker-build-push:
    name: Build and push API image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: mismplatform
          password: ${{ secrets.MISM_DOCKER_PUSH_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          BRANCH="${GITHUB_REF_NAME}"
          # Sanitize branch name for Docker tag (replace / with -)
          BRANCH_TAG="${BRANCH//\//-}"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "branch_tag=${BRANCH_TAG}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            mismplatform/exec-platform:${{ steps.meta.outputs.short_sha }}
            mismplatform/exec-platform:${{ steps.meta.outputs.branch_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
