apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mism-exec.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "mism-exec.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mism-exec.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "mism-exec.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: mism-exec
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            runAsUser: {{ .Values.securityContext.runAsUser }}
            runAsNonRoot: true
            allowPrivilegeEscalation: false
          ports:
            - containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: IRODS_PVC_NAME
              value: {{ .Values.storage.irodsPvcName | quote }}
            - name: IRODS_MOUNT_PATH
              value: {{ .Values.storage.irodsMountPath | quote }}
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: {{ .Values.database.secretKey }}
            - name: DATABASE_URL
              value: "postgresql+psycopg://{{ .Values.database.user }}:$(DATABASE_PASSWORD)@{{ .Values.database.host }}:{{ .Values.database.port }}/{{ .Values.database.name }}"
            - name: APPSTORE_URL
              value: {{ .Values.appstore.url | quote }}
            - name: APPSTORE_USERNAME
              value: {{ .Values.appstore.username | quote }}
            - name: APPSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.appstore.existingSecret }}
                  key: {{ .Values.appstore.secretKey }}
            - name: AMBASSADOR_URL
              value: {{ .Values.appstore.ambassadorUrl | quote }}
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.llm.existingSecret }}
                  key: {{ .Values.llm.secretKey }}
            - name: LLM_API_KEY_ENV_NAME
              value: {{ .Values.llm.apiKeyEnvName | quote }}
            - name: ENVBUILD_AGENT_IMAGE
              value: {{ .Values.envbuild.agentImage | quote }}
            - name: ENVBUILD_SERVICE_ACCOUNT
              value: {{ .Values.envbuild.serviceAccount | quote }}
            - name: ENVBUILD_WORK_PVC
              value: {{ .Values.envbuild.workPvc | quote }}
            - name: ENVBUILD_LLM_SECRET
              value: {{ .Values.envbuild.llmSecret | quote }}
            - name: ENVBUILD_TUNING_CONFIGMAP
              value: {{ .Values.envbuild.tuningConfigMap | quote }}
            - name: ENVBUILD_REGISTRY_SECRET
              value: {{ .Values.envbuild.registrySecret | quote }}
            - name: ENVBUILD_TTL_SECONDS
              value: {{ .Values.envbuild.ttlSeconds | quote }}
            - name: ENVBUILD_CPUS
              value: {{ .Values.envbuild.cpus | quote }}
            - name: ENVBUILD_MEMORY
              value: {{ .Values.envbuild.memory | quote }}
            - name: ENVBUILD_WORK_MOUNT_PATH
              value: {{ .Values.envbuild.workMountPath | quote }}
            - name: ENVBUILD_VERDICT_GRACE_SECONDS
              value: {{ .Values.envbuild.verdictGraceSeconds | quote }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if or .Values.storage.mountIrodsPvc .Values.envbuild.mountWorkPvc }}
          volumeMounts:
            {{- if .Values.storage.mountIrodsPvc }}
            - name: irods-data
              mountPath: {{ .Values.storage.irodsMountPath }}
              readOnly: {{ .Values.storage.readOnly }}
            {{- end }}
            {{- if .Values.envbuild.mountWorkPvc }}
            - name: envbuild-work
              mountPath: {{ .Values.envbuild.workMountPath }}
              readOnly: true
            {{- end }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: {{ .Values.probes.liveness.path }}
              port: {{ .Values.service.port }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
          readinessProbe:
            httpGet:
              path: {{ .Values.probes.readiness.path }}
              port: {{ .Values.service.port }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
      {{- if or .Values.storage.mountIrodsPvc .Values.envbuild.mountWorkPvc }}
      volumes:
        {{- if .Values.storage.mountIrodsPvc }}
        - name: irods-data
          persistentVolumeClaim:
            claimName: {{ .Values.storage.irodsPvcName }}
            readOnly: {{ .Values.storage.readOnly }}
        {{- end }}
        {{- if .Values.envbuild.mountWorkPvc }}
        - name: envbuild-work
          persistentVolumeClaim:
            claimName: {{ .Values.envbuild.workPvc }}
            readOnly: true
        {{- end }}
      {{- end }}
